# Configuración de la App en Wasmer Edge.
# Edita "owner" con tu usuario de Wasmer (wasmer.io) antes de ejecutar: wasmer deploy
kind: wasmer.io/App.v0
name: triade-org
owner: outnetstudios
package: .
volumes:
  - name: wp-content
    mount: /app/wp-content/uploads
scaling:
  mode: single_concurrency
capabilities:
  database:
    engine: mysql
  instaboot:
    max_age: 59m
    requests:
      - path: /
        headers:
          - name: Accept
            value: text/html
          - name: Accept-Language
            value: es-ES
      - path: /
        headers:
          - name: Accept
            value: text/html
          - name: Accept-Language
            value: es-ES
app_id: da_R36ILtlUz56Y
